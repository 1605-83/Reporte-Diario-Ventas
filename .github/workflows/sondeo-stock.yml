name: Sondeo de stock y vencimientos (solo lectura, solo estructura)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sondeo:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tablas y columnas de la base de Gescom
        shell: powershell
        env:
          GESCOM_LPE_CLAVE: ${{ secrets.GESCOM_LPE_CLAVE }}
        run: .\robot\sondeo-stock.ps1
