name: Actualizar tablero de vencimientos

on:
  schedule:
    - cron: '0 11 * * 1-6'    # 08:00 hora argentina, lunes a sabado (el deposito se lee a las 5:30)
  workflow_dispatch:         # boton "Run workflow" para correrlo a mano

permissions:
  contents: write
  actions: write                   # para encender el robot en vivo

concurrency:
  group: vencimientos
  cancel-in-progress: false

jobs:
  vencimientos:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leer lotes, venta de 30 dias y costos de la base de Gescom
        shell: powershell
        env:
          GESCOM_LPE_CLAVE: ${{ secrets.GESCOM_LPE_CLAVE }}
        run: .\robot\vencimientos.ps1

      - name: Subir los datos nuevos
        shell: bash
        run: |
          git config user.name "robot-gescom"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vencimientos/datos.json
          if git diff --cached --quiet; then
            echo "Sin cambios: no se sube nada"
          else
            git commit -m "Vencimientos actualizados desde Gescom ($(TZ=ART3 date '+%d/%m/%Y %H:%M'))"
            # los otros robots suben seguido: si se adelantaron, primero se trae lo suyo
            for n in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
          fi

      - name: Encender el robot en vivo si esta apagado (pedido de Bruno, 11/11/2026)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          h=$(TZ=ART3 date +%-H); d=$(TZ=ART3 date +%u)
          if [ "$d" -le 5 ] && [ "$h" -ge 7 ] && [ "$h" -lt 18 ]; then
            n=$(gh run list -R "$GITHUB_REPOSITORY" -w en-vivo.yml -L 5 --json status --jq "[.[]|select(.status!=\"completed\")]|length")
            if [ "$n" = "0" ]; then gh workflow run en-vivo.yml -R "$GITHUB_REPOSITORY" --ref main && echo "Robot en vivo lanzado"; else echo "Robot en vivo ya corriendo"; fi
          fi
