name: Actualizar tablero de vencimientos

on:
  schedule:
    - cron: '0 11 * * 1-6'    # 08:00 hora argentina, lunes a sabado (el deposito se lee a las 5:30)
  workflow_dispatch:         # boton "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: vencimientos
  cancel-in-progress: false

jobs:
  vencimientos:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leer lotes, venta de 30 dias y costos de la base de Gescom
        shell: powershell
        env:
          GESCOM_LPE_CLAVE: ${{ secrets.GESCOM_LPE_CLAVE }}
        run: .\robot\vencimientos.ps1

      - name: Subir los datos nuevos
        shell: bash
        run: |
          git config user.name "robot-gescom"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vencimientos/datos.json
          if git diff --cached --quiet; then
            echo "Sin cambios: no se sube nada"
          else
            git commit -m "Vencimientos actualizados desde Gescom ($(TZ=ART3 date '+%d/%m/%Y %H:%M'))"
            # los otros robots suben seguido: si se adelantaron, primero se trae lo suyo
            for n in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
          fi
