name: Sondeo combos Softys (solo lectura)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sondeo:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar la base
        shell: powershell
        env:
          GESCOM_LPE_CLAVE: ${{ secrets.GESCOM_LPE_CLAVE }}
        run: .\robot\sondeo-combos-softys.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: combos
          path: salida-combos/
          retention-days: 1
