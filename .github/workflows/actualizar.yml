name: Actualizar ventas desde Gescom

on:
  schedule:
    - cron: '0 10 * * 1-5'    # 07:00 hora argentina, lunes a viernes
    - cron: '30 16 * * 1-5'   # 13:30 hora argentina, lunes a viernes (pedido de Bruno, 13/10/2026)
    # 24/11/2026: GitHub largaba estas corridas con 8 a 10 horas de atraso. Horarios extra en minutos raros
    # (en la hora en punto descarta muchas); si ya hubo una actualizacion hace menos de 2 horas, la extra no hace nada.
    - cron: '17 10 * * 1-5'   # 07:17
    - cron: '43 11 * * 1-5'   # 08:43
    - cron: '13 13 * * 1-5'   # 10:13
    - cron: '47 16 * * 1-5'   # 13:47
    - cron: '23 18 * * 1-5'   # 15:23
  workflow_dispatch:         # boton "Run workflow" para correrlo a mano

permissions:
  contents: write
  actions: write                   # para encender el robot en vivo

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: windows-latest
    steps:
      - name: Ver si hace falta (las corridas automaticas se saltean si ya hubo una hace menos de 2 horas)
        id: falta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "si=1" >> $GITHUB_OUTPUT; exit 0; fi
          ult=$(gh api "repos/$GITHUB_REPOSITORY/commits?path=archivos.json&per_page=1" --jq '.[0].commit.committer.date // ""')   # ultima vez que el robot subio un archivo del mes
          if [ -n "$ult" ] && [ $(( $(date +%s) - $(date -d "$ult" +%s) )) -lt 7200 ]; then echo "Ya se actualizo a las $ult: no hace falta"; echo "si=0" >> $GITHUB_OUTPUT; else echo "si=1" >> $GITHUB_OUTPUT; fi

      - uses: actions/checkout@v4
        if: steps.falta.outputs.si == '1'

      - name: Bajar ventas de la base de Gescom y armar el CSV
        if: steps.falta.outputs.si == '1'
        shell: powershell
        env:
          GESCOM_LPE_CLAVE: ${{ secrets.GESCOM_LPE_CLAVE }}
        run: .\robot\actualizar.ps1 -Salida .

      - name: Subir el CSV nuevo
        if: steps.falta.outputs.si == '1'
        shell: bash
        run: |
          git config user.name "robot-gescom"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          { ls -1 *.csv meses/*.csv 2>/dev/null || true; } | awk 'BEGIN{printf "{\"archivos\":["} {printf "%s\"%s\"", (NR>1?",":""), $0} END{print "]}"}' > archivos.json
          git add -A -- '*.csv'
          git add archivos.json
          if [ -f carteras.json ]; then git add carteras.json; fi
          if git diff --cached --quiet; then
            echo "Sin cambios: no se sube nada"
          else
            git commit -m "Ventas actualizadas desde Gescom ($(TZ=ART3 date '+%d/%m/%Y %H:%M'))"
            # el robot en vivo sube cada hora: si se adelanto, primero se trae lo suyo
            for n in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
          fi

      - name: Encender el robot en vivo si esta apagado (pedido de Bruno, 11/11/2026)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          h=$(TZ=ART3 date +%-H); d=$(TZ=ART3 date +%u)
          if [ "$d" -le 5 ] && [ "$h" -ge 7 ] && [ "$h" -lt 18 ]; then
            n=$(gh run list -R "$GITHUB_REPOSITORY" -w en-vivo.yml -L 5 --json status --jq "[.[]|select(.status!=\"completed\")]|length")
            if [ "$n" = "0" ]; then gh workflow run en-vivo.yml -R "$GITHUB_REPOSITORY" --ref main && echo "Robot en vivo lanzado"; else echo "Robot en vivo ya corriendo"; fi
          fi
