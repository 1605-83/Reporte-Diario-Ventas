name: Venta del dia en vivo

# La base de Gescom suma ventas nuevas cada hora en punto, de 7 a 17 (lunes a sabado).
# Este robot revisa cada 15 minutos y, solo si la base cambio, sube vivo/hoy.csv con lo cargado hoy
# (pedido de Bruno, 20/10/2026). La pagina Venta del dia lo lee sola, sin recargar.
on:
  schedule:
    - cron: '*/15 10-20 * * 1-6'   # 07:00 a 17:45 hora argentina, lunes a sabado
  workflow_dispatch:               # boton "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: en-vivo
  cancel-in-progress: false

jobs:
  en-vivo:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Bajar los pedidos de hoy de la base de Gescom
        shell: powershell
        env:
          GESCOM_LPE_CLAVE: ${{ secrets.GESCOM_LPE_CLAVE }}
        run: .\robot\actualizar.ps1 -Salida . -SoloHoy

      - name: Subir la venta del dia
        shell: bash
        run: |
          git config user.name "robot-gescom"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vivo/
          if git diff --cached --quiet; then
            echo "Sin cambios: no se sube nada"
          else
            git commit -m "Venta del dia en vivo ($(TZ=ART3 date '+%d/%m/%Y %H:%M'))"
            for n in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
          fi
